<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <li onclick="window.location.href='index.html'" style="text-decoration:underline;">Currency Converter</li>
        <div class="headerLinks">
            <li onclick="window.location.href='help.html'">Help</li>
            <li onclick="window.location.href='about.html'">About</li>
        </div>
    </header>

    <div class="parent">
        <div class="container">
            <form>
                <h2>Enter Amount</h2>
                <input type="number" placeholder="Enter amount" class="inputValue">
            </form>
            <div class="convert">
                <div class="from">
                    <h2>From</h2>
                    <div class="selectContainer">
                        <img src="https://flagsapi.com/US/flat/64.png">
                        <select></select>
                    </div>
                </div>
            
                <i class="fa-solid fa-arrow-right-arrow-left" style="color: rgb(15, 31, 43);" onclick="rotater()"></i>
            
                <div class="to">
                    <h2>To</h2>
                    <div class="selectContainer">
                        <img src="https://flagsapi.com/IN/flat/64.png">
                        <select></select>
                    </div>
                </div>
            </div>
            <button class="getResult" type="button">Get Exchange Rate</button>
            <p class="result"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
